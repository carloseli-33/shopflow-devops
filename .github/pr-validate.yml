name: "PR Validation"

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Cancel older runs when a new commit is pushed to the same PR
concurrency:
  group: "pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Tests & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: "Install dependencies"
        run: |
          pip install -r docker/user-service/requirements.txt
          pip install pytest pytest-cov bandit
      - name: "Bandit SAST security scan"
        run: bandit -r docker/ -ll
      - name: "Run unit tests with coverage"
        run: pytest tests/ -v --cov=docker/ --junitxml=reports/results.xml
      - name: "Upload test results"
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: reports/ }

  terraform-validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.6.6" }
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  docker-build-test:
    name: "Docker Build Test (no push)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: docker/user-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
